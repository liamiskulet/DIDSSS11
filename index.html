<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIDSSS Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    .center-screen {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      animation: fadeIn 0.7s ease;
    }

    .login-card h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      text-align: center;
    }

    .login-card p {
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .input-group input:focus {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 2px #3b82f6;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .chat-app {
      width: 100%;
      height: 100vh;
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    .sidebar {
      width: 320px;
      background: rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 16px;
      transition: 0.2s ease;
    }

    .user-card:hover {
      background: rgba(255,255,255,0.1);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(10px);
    }

    .chat-header h2 {
      font-size: 1.4rem;
    }

    .messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.5;
      animation: slideUp 0.25s ease;
    }

    .incoming {
      background: rgba(255,255,255,0.08);
      align-self: flex-start;
    }

    .outgoing {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      align-self: flex-end;
    }

    .message-bar {
      padding: 20px;
      display: flex;
      gap: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }

    .message-bar input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1rem;
    }

    .send-btn {
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .send-btn:hover {
      transform: scale(1.03);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 850px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="center-screen" id="loginScreen">
    <div class="login-card">
      <h1>DIDSSS Chat</h1>
      <p>Log in to continue chatting with people online.</p>

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
      </div>

      <button class="login-btn" onclick="login()">Log In</button>
    </div>
  </div>

  <div class="chat-app hidden" id="chatApp">
    <div class="sidebar">
      <h2>Online Users</h2>

      <div class="user-list" id="userList">
        <div class="user-card">
          <div class="status-dot"></div>
          <span>Alex</span>
        </div>

        <div class="user-card">
          <div class="status-dot"></div>
          <span>Sophia</span>
        </div>

        <div class="user-card">
          <div class="status-dot"></div>
          <span>Jordan</span>
        </div>

        <div class="user-card">
          <div class="status-dot"></div>
          <span>Chris</span>
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <h2>Global Chat</h2>
      </div>

      <div class="messages" id="messages">
        <div class="message incoming">
          Welcome to DIDSSS Chat.
        </div>
      </div>

      <div class="message-bar">
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = "";

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('Please enter a username and password.');
        return;
      }

      currentUser = username;

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('chatApp').classList.remove('hidden');

      const userList = document.getElementById('userList');
      const userCard = document.createElement('div');
      userCard.className = 'user-card';
      userCard.innerHTML = `
        <div class="status-dot"></div>
        <span>${currentUser} (You)</span>
      `;

      userList.prepend(userCard);
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const messageText = input.value.trim();

      if (!messageText) return;

      const messages = document.getElementById('messages');

      const message = document.createElement('div');
      message.className = 'message outgoing';
      message.textContent = messageText;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      input.value = '';
    }

    document.getElementById('messageInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
