<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // =========================
  // SUPABASE CONFIG
  // =========================

  const SUPABASE_URL = "https://supabase.com/dashboard/project/gmdfgbljforrkugnogev/settings/api-keys";
  const SUPABASE_KEY = "sb_publishable_MXMuRHWCpVdGZZhvcR0ehw_NA4WfMK-";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // =========================
  // APP
  // =========================

  let currentUser = "";

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      alert('Please enter a username and password.');
      return;
    }

    currentUser = username;

    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('chatApp').classList.remove('hidden');

    const userList = document.getElementById('userList');

    const userCard = document.createElement('div');
    userCard.className = 'user-card';

    userCard.innerHTML = `
      <div class="status-dot"></div>
      <span>${currentUser} (You)</span>
    `;

    userList.prepend(userCard);

    await loadMessages();
  }

  // =========================
  // SEND MESSAGE
  // =========================

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const messageText = input.value.trim();

    if (!messageText) return;

    const { error } = await supabase
      .from('messages')
      .insert([
        {
          username: currentUser,
          content: messageText
        }
      ]);

    if (error) {
      console.error(error);
      alert('Failed to send message.');
      return;
    }

    input.value = '';
  }

  // =========================
  // LOAD MESSAGES
  // =========================

  async function loadMessages() {
    const { data, error } = await supabase
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true });

    if (error) {
      console.error(error);
      return;
    }

    const messages = document.getElementById('messages');

    messages.innerHTML = '';

    data.forEach(msg => {
      addMessageToUI(msg);
    });

    messages.scrollTop = messages.scrollHeight;
  }

  // =========================
  // ADD MESSAGE TO UI
  // =========================

  function addMessageToUI(msg) {
    const messages = document.getElementById('messages');

    const message = document.createElement('div');

    message.className =
      msg.username === currentUser
        ? 'message outgoing'
        : 'message incoming';

    message.textContent = `${msg.username}: ${msg.content}`;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
  }

  // =========================
  // REALTIME CHAT
  // =========================

  supabase
    .channel('chat-room')
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'messages'
      },
      payload => {
        addMessageToUI(payload.new);
      }
    )
    .subscribe();

  // =========================
  // ENTER TO SEND
  // =========================

  document
    .getElementById('messageInput')
    .addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
</script>
